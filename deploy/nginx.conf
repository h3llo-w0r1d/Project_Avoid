# 바깥에서 오는 요청을 게임 서버로 넘긴다.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/avoidarc
#   sudo ln -s /etc/nginx/sites-available/avoidarc /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# avoidarc.kr 은 실제 도메인으로 바꾼다.

server {
    listen 80;
    listen [::]:80;
    server_name avoidarc.kr www.avoidarc.kr;

    # 업로드는 없다. 크게 열어 둘 이유가 없다.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 1v1 은 WebSocket 이다. 이 두 줄이 없으면 대전만 안 된다.
        # (게임은 멀쩡히 뜨는데 매칭에서 멈춰서 원인을 찾기 어렵다.)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 서버가 기록 도배를 IP 로 막는다. 이게 없으면 전부 같은 IP 로 보인다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 대전 중에는 한동안 조용할 수 있다. 기본값(60초)이면 끊긴다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전기 피하기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MENU -->
  <div id="menuScreen" class="screen">
    <div class="menu-box">
      <h1>⚡ 전기 피하기</h1>
      <p class="subtitle">날아오는 전기를 점프로 피하라!</p>

      <div class="map-grid" style="grid-template-columns:1fr 1fr">
        <div class="map-card selected" data-map="square">
          <div class="map-icon">🔥</div>
          <div class="map-name">지옥 경기장</div>
        </div>
        <div class="map-card" data-map="ice">
          <div class="map-icon">❄️</div>
          <div class="map-name">빙하 경기장</div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn cyan" id="soloBtn">👤 솔로</button>
        <button class="btn purple" id="online1v1Btn">🌐 온라인 1v1</button>
      </div>
      <div class="btn-row">
        <button class="btn ghost" id="leaderboardBtn">🏆 랭킹</button>
      </div>

      <div class="hint">
        <span>이동: <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> &nbsp;|&nbsp; 점프: <kbd>Ctrl</kbd></span>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div id="gameScreen" class="screen hidden">
    <canvas id="gameCanvas"></canvas>
    <!-- HTML HUD overlay -->
    <div id="hud">
      <div id="timerDisplay">00:00.00</div>
      <div id="hudLabels"></div>
    </div>
    <button class="btn ghost sm" id="escBtn" style="position:absolute;top:14px;right:14px;z-index:10">⏸ 일시정지</button>

    <!-- PAUSE OVERLAY -->
    <div id="pauseOverlay">
      <div class="modal" style="gap:0">
        <h2>⏸ 일시정지</h2>
        <div class="time-block" style="margin-top:18px">
          <div class="time-label">현재 시간</div>
          <div class="time-val" id="pauseTime">00:00.00</div>
        </div>
        <div class="btn-row" style="margin-top:4px">
          <button class="btn cyan" id="resumeBtn">▶ 계속하기</button>
          <button class="btn ghost" id="pauseMenuBtn">홈으로</button>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="gameOverScreen" class="screen hidden">
    <div class="modal">
      <h2 id="goTitle">게임 오버</h2>
      <p id="goSub" class="sub"></p>
      <div class="time-block">
        <div class="time-label">생존 시간</div>
        <div class="time-val" id="finalTime">00:00.00</div>
      </div>
      <div id="rankBlock" class="hidden">
        <div id="rankText" class="rank-txt"></div>
      </div>
      <div id="nameBlock" class="name-row">
        <input id="nameInput" type="text" placeholder="이름 입력 (랭킹 등록)" maxlength="20"/>
        <button class="btn cyan sm" id="submitBtn">등록</button>
      </div>
      <div id="miniRank"></div>
      <div class="btn-row">
        <button class="btn cyan" id="replayBtn">다시 플레이</button>
        <button class="btn ghost" id="menuBtn">메인 메뉴</button>
      </div>
    </div>
  </div>

  <!-- LEADERBOARD -->
  <div id="lbScreen" class="screen hidden">
    <div class="modal">
      <h2>🏆 랭킹</h2>
      <div class="tab-row">
        <button class="tab active" data-id="square">지옥 경기장</button>
        <button class="tab" data-id="ice">빙하 경기장</button>
      </div>
      <ol id="lbList" class="lb-list"></ol>
      <button class="btn ghost" id="lbBackBtn">← 뒤로</button>
    </div>
  </div>

  <!-- MATCHMAKING -->
  <div id="mmScreen" class="screen hidden">
    <div class="modal center">
      <div class="spinner"></div>
      <h2>매칭 중...</h2>
      <p id="mmStatus" class="sub">상대방을 찾는 중</p>
      <button class="btn ghost" id="mmCancelBtn">취소</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/three.min.js"></script>
  <script src="/js/GLTFLoader.js"></script>
  <script src="js/game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>만드라이더</title>
  <link rel="stylesheet" href="./fonts.css" />
  <link rel="stylesheet" href="./mandrider.css" />
</head>
<body>
  <canvas id="race-stage"></canvas>

  <section id="map-select" class="map-select" aria-labelledby="map-title">
    <div class="map-panel">
      <p class="map-kicker">MANDRIDER</p>
      <h1 id="map-title">달릴 맵과 카트를 골라 주세요</h1>
      <h2 class="pick-title">맵</h2>
      <button class="map-card selected" type="button" aria-pressed="true" data-map="circuit">
        <span class="map-thumb" aria-hidden="true">
          <svg viewBox="0 0 100 76">
            <path d="M50 68H18V8H86V18H47V28H86V38H47V48H86V58H47V68H91Z" />
            <path d="M50 68V73" /><circle cx="50" cy="74" r="2.2" />
          </svg>
        </span>
        <span class="map-copy"><strong>만드라고라 서킷</strong><small>난이도 ●●●○○ · 장거리 연속 헤어핀</small></span>
        <span class="map-check">선택됨</span>
      </button>
      <button class="map-card" type="button" aria-pressed="false" data-map="speedway">
        <span class="map-thumb" aria-hidden="true">
          <svg viewBox="0 0 100 76">
            <path d="M50 68L27.4 68L16.5 65.3L10 59.1L10 16.9L16.5 10.7L27.4 8L38.4 9.4L50 11.4L61.6 9.4L72.6 8L83.5 10.7L90 16.9L90 59.1L83.5 65.3L72.6 68Z" />
            <path d="M50 68V73" /><circle cx="50" cy="74" r="2.2" />
          </svg>
        </span>
        <span class="map-copy"><strong>그랑프리 스피드웨이</strong><small>난이도 ●●○○○ · 초광폭 트랙 · 대형 코너와 시케인</small></span>
        <span class="map-check">선택됨</span>
      </button>
      <h2 class="pick-title">카트</h2>
      <button class="kart-card selected" type="button" aria-pressed="true" data-kart="pot">
        <span class="map-thumb" aria-hidden="true">
          <svg viewBox="0 0 100 76">
            <path d="M34 34H66L62 64H38Z" /><path d="M31 30H69V36H31Z" />
            <path d="M50 30V20" /><path d="M50 22C44 14 38 14 36 10C42 9 47 13 50 20C53 13 58 9 64 10C62 14 56 14 50 22Z" />
          </svg>
        </span>
        <span class="map-copy"><strong>만드라고라 화분</strong><small>기본 카트</small></span>
        <span class="map-check">선택됨</span>
      </button>
      <button class="kart-card" type="button" aria-pressed="false" data-kart="pigeon">
        <span class="map-thumb" aria-hidden="true">
          <svg viewBox="0 0 100 76">
            <path d="M28 46C28 34 38 26 50 26C62 26 70 32 74 38L86 34L76 44C76 54 66 58 54 58L36 58Z" />
            <path d="M36 58L30 66" /><path d="M52 58L48 66" />
            <path d="M42 30V18" /><path d="M42 22C36 16 32 16 30 13C35 12 39 15 42 20C45 15 49 12 54 13C52 16 48 16 42 22Z" />
          </svg>
        </span>
        <span class="map-copy"><strong>비둘기</strong><small>만드라고라를 태운 가벼운 몸집</small></span>
        <span class="map-check">선택됨</span>
      </button>
      <button class="kart-card" type="button" aria-pressed="false" data-kart="chicken">
        <span class="map-thumb" aria-hidden="true">
          <svg viewBox="0 0 100 76">
            <path d="M30 50C30 36 40 28 52 28C66 28 74 36 74 48C74 58 64 64 52 64C40 64 30 60 30 50Z" />
            <path d="M52 28L50 18" /><path d="M74 42L86 40" />
            <path d="M44 64L40 72" /><path d="M60 64L58 72" />
            <path d="M38 34V22" /><path d="M38 26C32 20 28 20 26 17C31 16 35 19 38 24C41 19 45 16 50 17C48 20 44 20 38 26Z" />
          </svg>
        </span>
        <span class="map-copy"><strong>닭</strong><small>만드라고라를 태운 듬직한 몸집</small></span>
        <span class="map-check">선택됨</span>
      </button>


      <button id="start-race" type="button">출발</button>
      <a href="/">돌아가기</a>
    </div>
  </section>

  <header class="race-head">
    <a href="/" aria-label="AvoidArc로 돌아가기">← 돌아가기</a>
    <div><strong>만드라이더</strong><small id="race-map-name">만드라고라 서킷</small></div>
  </header>

  <section class="minimap-panel" aria-label="코스 지도">
    <span>COURSE MAP</span>
    <canvas id="minimap" width="190" height="250"></canvas>
  </section>

  <section id="race-hud" aria-label="주행 정보">
    <div class="race-time"><span>TIME</span><b id="race-time">00:00.000</b></div>
    <div class="lap"><b id="lap">1 / 3</b><span>LAP</span></div>
    <div id="speed-dial" class="speed"><b id="speed">0</b><span>km/h</span></div>
    <div class="meter">
      <div class="meter-row"><span>드리프트 게이지</span><b id="drift-percent">0%</b></div>
      <div class="meter-track"><i id="drift-fill"></i></div>
      <div id="boost-slots" class="boost-slots" aria-label="부스터 0개"><i></i><i></i></div>
    </div>
  </section>

  <div id="countdown" aria-live="assertive">3</div>

  <aside class="controls-help">
    <b>방향키</b> 주행 · <b>Shift</b> 드리프트 · <b>Ctrl / Space</b> 부스터 · <b>R</b> 재시작<br />
    드리프트 후 가속키를 다시 눌러 순간 부스터 · 반대 방향키로 커팅 드리프트
  </aside>

  <div id="race-touch" aria-label="모바일 조작">
    <div class="touch-steer"><button data-drive="left">◀</button><button data-drive="right">▶</button></div>
    <div class="touch-actions">
      <button data-drive="brake">브레이크</button>
      <button class="drift" data-drive="drift">드리프트</button>
      <button class="boost" data-drive="boost">부스터</button>
      <button class="gas" data-drive="up">가속</button>
    </div>
  </div>

  <script type="importmap">
  { "imports": { "three": "./js/vendor/three.module.min.js" } }
  </script>
  <script type="module" src="./js/mandrider.js"></script>
</body>
</html>
